name: Snake animation

# Genera la animación de la serpiente comiéndose el grid de contribuciones
# de jandrescodes y la publica como SVG en la rama `output`.
# Antes el README apuntaba al output de platane/snk (datos de otra persona).
# Usa el GITHUB_TOKEN nativo, no necesita PAT.

on:
  schedule:
    - cron: "0 3 * * *" # cada día a las 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-snake
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
